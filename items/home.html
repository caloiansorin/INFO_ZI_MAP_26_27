<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplicație Meteo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #dbeafe, #eff6ff);
      }
      .weather-card {
        width: 420px;
        max-width: calc(100% - 32px);
        padding: 32px 24px;
        border-radius: 24px;
        background: white;
        box-shadow: 0 15px 40px rgba(30, 64, 175, 0.12);
      }
      form {
        display: flex;
        gap: 10px;
        margin-bottom: 24px;
      }
      input {
        flex: 1;
        padding: 12px 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 16px;
      }
      button {
        padding: 12px 16px;
        border: none;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-weight: bold;
        cursor: pointer;
      }
      .weather-icon {
        font-size: 56px;
        text-align: center;
        margin: 12px 0;
      }
      .city {
        margin: 0;
        font-size: 28px;
        text-align: center;
        color: #1e293b;
      }
      .temperature {
        font-size: 52px;
        font-weight: bold;
        color: #2563eb;
        text-align: center;
        margin: 10px 0;
      }
      .condition,
      .wind,
      .error {
        text-align: center;
        color: #334155;
        font-size: 18px;
      }
      .error {
        color: #b91c1c;
        margin-bottom: 14px;
      }
    </style>
  </head>
  <body>
    <div class="weather-card">
      <form method="get" action="/">
        <input
          type="text"
          name="oras"
          value="{{ oras or '' }}"
          placeholder="Introdu numele orașului"
          required
        />
        <button type="submit">Caută</button>
      </form>

      {% if eroare %}
      <p class="error">{{ eroare }}</p>
      {% endif %} {% if date %}
      <h1 class="city">{{ oras|title }}</h1>
      <div class="weather-icon">⛅</div>
      <p class="temperature">{{ date.temperatura }}°C</p>
      <p class="condition">{{ date.starea_vremii|capitalize }}</p>
      <p class="wind">💨 Viteza vântului: {{ date.viteza_vant }} km/h</p>
      {% endif %}
    </div>
  </body>
</html>
